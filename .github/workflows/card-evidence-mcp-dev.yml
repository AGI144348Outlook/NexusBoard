name: NexusBoard card-evidence MCP contract tests
on:
  push:
    branches: [feature/neon-card-evidence]
    paths:
      - 'mcp/neon/**'
      - '.github/workflows/card-evidence-mcp-dev.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preregistered test issue
        run: echo "https://github.com/AGI144348Outlook/NexusBoard/issues/2"
      - name: Unit tests, no external services
        run: node --test mcp/neon/test_rpc.mjs
